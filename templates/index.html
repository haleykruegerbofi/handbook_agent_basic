<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Handbook Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0b1e34 0%, #112e4e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: none;
        }

        .header {
            background: linear-gradient(135deg, #0b1e34 0%, #112e4e 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }

        .logo-emoji {
            font-size: 48px;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.user .bubble {
            background: #1c3556;
            color: white;
            margin-left: auto;
        }

        .message.assistant .bubble {
            background: white;
            border: 1px solid #e0e0e0;
        }

        .bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-container {
            padding: 20px;
            background: white;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .question-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .question-input:focus {
            outline: none;
            border-color: #1c3556;
        }

        .submit-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #0b1e34 0%, #1c3556 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .ticket-draft {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .ticket-draft h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .ticket-field {
            display: flex;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .ticket-field strong {
            min-width: 120px;
            color: #495057;
        }

        .ticket-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .ticket-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .ticket-btn.submit {
            background: #28a745;
            color: white;
        }

        .ticket-btn.submit:hover {
            background: #218838;
        }

        .ticket-btn.cancel {
            background: #6c757d;
            color: white;
        }

        .ticket-btn.cancel:hover {
            background: #5a6268;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .welcome-message {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .welcome-message h3 {
            margin-bottom: 15px;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Logo Section - Axos Bank logo with emoji fallback -->
            <div class="logo">
                <img src="/static/axos-bank-862d8977d2df497884f05c147bf84437.png" alt="Axos Bank" onerror="this.style.display='none'; document.getElementById('logoEmoji').style.display='block';">
                <span id="logoEmoji" class="logo-emoji" style="display:none;">🏢</span>
            </div>
            
            <h1>Axos Employee Handbook Assistant</h1>
            <p>Ask questions about company policies and procedures</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message" id="welcomeMessage">
                <h3>Welcome! How can I help you today?</h3>
                <p>I can answer questions about our employee handbook, including policies, benefits, procedures, and more.</p>
            </div>
        </div>
        
        <div class="input-container">
            <form id="questionForm" class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    class="question-input" 
                    placeholder="Ask a question about the employee handbook..."
                    required
                >
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">Ask</span>
                    <span id="btnLoading" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        let isProcessing = false;
        let currentTicketDraft = null;
        let awaitingTicketResponse = false;
        let lastQuestion = null;

        document.getElementById('questionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isProcessing) return;
            
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            
            if (!question) return;
            
            // Hide welcome message on first question
            const welcomeMsg = document.getElementById('welcomeMessage');
            if (welcomeMsg) {
                welcomeMsg.style.display = 'none';
            }
            
            // Add user message
            addMessage(question, 'user');
            
            // Clear input and disable while processing
            input.value = '';
            setProcessing(true);
            
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        question: question,
                        awaiting_response: awaitingTicketResponse 
                    })
                });
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    // Always show the answer first
                    addMessage(data.answer, 'assistant');
                    
                    // Check if we should set up for ticket response
                    if (data.offer_ticket) {
                        lastQuestion = data.original_question || question;
                        awaitingTicketResponse = true;
                    } else if (data.ticket_drafted && data.ticket_content) {
                        // Full ticket was created
                        currentTicketDraft = data.ticket_content;
                        addFullTicket(data.ticket_content);
                        awaitingTicketResponse = false;
                    } else {
                        awaitingTicketResponse = false;
                    }
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
                    awaitingTicketResponse = false;
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, I couldn\'t connect to the server. Please try again.', 'assistant');
                awaitingTicketResponse = false;
            } finally {
                setProcessing(false);
            }
        });

        function addMessage(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = sender === 'user' ? 'You' : 'Assistant';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // Preserve line breaks and bold text
            bubble.innerHTML = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Removed addTicketOffer function - users will just type yes/no

        function addFullTicket(ticketContent) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = 'Assistant';
            
            const ticketDiv = document.createElement('div');
            ticketDiv.className = 'ticket-draft';
            
            ticketDiv.innerHTML = `
                <h4>📋 Support Ticket Draft</h4>
                <div class="ticket-field">
                    <strong>Ticket ID:</strong>
                    <span>${ticketContent.ticket_id}</span>
                </div>
                <div class="ticket-field">
                    <strong>Subject:</strong>
                    <span>${ticketContent.subject}</span>
                </div>
                <div class="ticket-field">
                    <strong>Description:</strong>
                    <span>${ticketContent.description}</span>
                </div>
                <div class="ticket-field">
                    <strong>Priority:</strong>
                    <span style="text-transform: uppercase;">${ticketContent.priority}</span>
                </div>
                <div class="ticket-actions">
                    <button class="ticket-btn submit" onclick="submitTicket()">Submit Ticket</button>
                    <button class="ticket-btn cancel" onclick="cancelTicket()">Cancel</button>
                </div>
            `;
            
            currentTicketDraft = ticketContent;
            messageDiv.appendChild(label);
            messageDiv.appendChild(ticketDiv);
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Removed respondToTicketOffer - users will type yes/no directly

        async function submitTicket() {
            if (!currentTicketDraft || isProcessing) return;
            
            setProcessing(true);
            
            // Disable ticket buttons
            document.querySelectorAll('.ticket-btn').forEach(btn => btn.disabled = true);
            
            try {
                const response = await fetch('/api/submit-ticket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        ticket: currentTicketDraft 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Replace ticket draft with success message
                    const ticketDrafts = document.querySelectorAll('.ticket-draft');
                    const lastDraft = ticketDrafts[ticketDrafts.length - 1];
                    if (lastDraft) {
                        lastDraft.innerHTML = `
                            <h4>✅ Ticket Submitted Successfully</h4>
                            <p>${data.message}</p>
                        `;
                    }
                } else {
                    addMessage('Sorry, I couldn\'t submit the ticket. Please try again.', 'assistant');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, I couldn\'t submit the ticket. Please try again.', 'assistant');
            } finally {
                currentTicketDraft = null;
                setProcessing(false);
            }
        }

        function cancelTicket() {
            currentTicketDraft = null;
            
            // Remove ticket draft UI
            const ticketDrafts = document.querySelectorAll('.ticket-draft');
            const lastDraft = ticketDrafts[ticketDrafts.length - 1];
            if (lastDraft) {
                lastDraft.innerHTML = '<p>Ticket draft cancelled.</p>';
                setTimeout(() => {
                    lastDraft.parentElement.parentElement.remove();
                }, 2000);
            }
        }

        function setProcessing(processing) {
            isProcessing = processing;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const input = document.getElementById('questionInput');
            
            submitBtn.disabled = processing;
            input.disabled = processing;
            
            if (processing) {
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-block';
            } else {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
